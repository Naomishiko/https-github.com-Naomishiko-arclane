<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ARCLANE — Recovery dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<div class="app-head">
  <div class="wrap app-head__inner">
    <a class="wordmark" href="/">ARCLANE<span>.</span></a>
    <div class="app-head__actions">
      <button class="btn btn--sm" id="reset">Reset Demo</button>
      <a class="btn btn--sm btn--solid" href="/">← Back To Site</a>
    </div>
  </div>
</div>

<main class="wrap app-body">
  <div class="banner" id="banner" hidden>
    <span id="bannerText"></span>
    <button class="btn btn--sm" id="bannerBtn"></button>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="toolbar">
    <div class="tabs" id="tabs">
      <button class="tab is-active" data-filter="all">All</button>
      <button class="tab" data-filter="neglected">Neglected</button>
      <button class="tab" data-filter="new">New</button>
      <button class="tab" data-filter="contacted">Contacted</button>
      <button class="tab" data-filter="quoted">Quoted</button>
      <button class="tab" data-filter="won">Won</button>
      <button class="tab" data-filter="lost">Lost</button>
    </div>
    <input class="search" id="search" placeholder="SEARCH NAME, COMPANY OR SERVICE" />
  </div>

  <div class="table" id="table"></div>
</main>

<div class="toast" id="toast"></div>

<script>
const fmt = (n) => "$" + Math.round(n).toLocaleString();
const state = { filter: "all", q: "", inquiries: [], summary: null };

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error("Request failed: " + res.status);
  return res.json();
}

function pillFor(x) {
  if (x.status === "won") return '<span class="pill pill--green">Won</span>';
  if (x.status === "lost") return '<span class="pill pill--grey">Lost</span>';
  if (x.neglected) return '<span class="pill pill--red">Neglected</span>';
  if (x.priority === "high") return '<span class="pill pill--amber">Urgent</span>';
  return '<span class="pill pill--blue">On Track</span>';
}

function renderKpis() {
  const s = state.summary;
  document.getElementById("kpis").innerHTML = `
    <div class="kpi kpi--risk">
      <div class="kpi__label">Revenue at risk</div>
      <div class="kpi__value">${fmt(s.revenueAtRisk)}</div>
      <div class="kpi__sub">${s.neglected} neglected of ${s.open} open</div>
    </div>
    <div class="kpi">
      <div class="kpi__label">Open pipeline</div>
      <div class="kpi__value">${fmt(s.openValue)}</div>
      <div class="kpi__sub">${s.open} live inquiries</div>
    </div>
    <div class="kpi">
      <div class="kpi__label">Recovered</div>
      <div class="kpi__value">${fmt(s.recoveredValue)}</div>
      <div class="kpi__sub">${s.wonCount} won · ${s.winRate}% win rate</div>
    </div>
    <div class="kpi">
      <div class="kpi__label">Avg response</div>
      <div class="kpi__value">${s.avgResponseHours}h</div>
      <div class="kpi__sub">Target ${s.neglectHours}h</div>
    </div>`;
}

function renderBanner() {
  const s = state.summary;
  const banner = document.getElementById("banner");
  const text = document.getElementById("bannerText");
  const btn = document.getElementById("bannerBtn");
  if (s.neglected > 0) {
    banner.hidden = false;
    text.innerHTML = `<strong>${s.neglected} INQUIRIES UNANSWERED</strong> — worth ${fmt(s.revenueAtRisk)} in potential revenue. Start with the oldest.`;
    btn.textContent = "Show Neglected";
    btn.onclick = () => setFilter("neglected");
  } else {
    banner.hidden = true;
  }
}

function renderTable() {
  const rows = state.inquiries;
  const el = document.getElementById("table");
  if (!rows.length) {
    el.innerHTML = '<div class="empty">Nothing here — every inquiry is on track</div>';
    return;
  }
  el.innerHTML = `
    <div class="trow trow--head">
      <div>Customer</div><div>Service</div><div>Value</div><div>Status</div><div>Next action</div><div></div>
    </div>` + rows.map(rowHtml).join("");
}

function rowHtml(x) {
  const actions = [];
  if (x.status === "new" && !x.firstRespondedAt) {
    actions.push(`<button class="icon-btn icon-btn--primary" data-act="respond" data-id="${x.id}">Reply</button>`);
  }
  if (x.open) {
    actions.push(`<button class="icon-btn" data-act="followup" data-id="${x.id}">Follow Up</button>`);
    if (x.status === "contacted") actions.push(`<button class="icon-btn" data-act="quote" data-id="${x.id}">Quoted</button>`);
    actions.push(`<button class="icon-btn" data-act="won" data-id="${x.id}">Won</button>`);
    actions.push(`<button class="icon-btn" data-act="lost" data-id="${x.id}">Lost</button>`);
  }
  return `
    <div class="trow ${x.neglected ? "trow--neglected" : ""}">
      <div class="who">${x.customer}<small>${x.company || "—"} · ${x.channel}${x.owner && x.owner !== "Unassigned" ? " · " + x.owner : ""}</small></div>
      <div>${x.service}<div class="cell-sub">${Math.round(x.ageHours)}h old · ${x.followUps} follow-up${x.followUps === 1 ? "" : "s"}</div></div>
      <div class="money-val ${x.neglected ? "risk" : ""}">${fmt(x.value)}</div>
      <div>${pillFor(x)}</div>
      <div class="cell-sub" style="margin-top:0">${x.nextAction}</div>
      <div class="actions">${actions.join("")}</div>
    </div>`;
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("is-on");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("is-on"), 2200);
}

async function load() {
  const params = new URLSearchParams();
  if (state.filter === "neglected") params.set("neglected", "1");
  else if (state.filter !== "all") params.set("status", state.filter);

  const [inquiries, summary] = await Promise.all([
    api("/api/inquiries?" + params.toString()),
    api("/api/summary"),
  ]);
  let items = inquiries.inquiries;
  if (state.q) {
    const q = state.q.toLowerCase();
    items = items.filter((x) =>
      (x.customer + " " + x.company + " " + x.service).toLowerCase().includes(q)
    );
  }
  state.inquiries = items;
  state.summary = summary;
  renderKpis();
  renderBanner();
  renderTable();
}

function setFilter(f) {
  state.filter = f;
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("is-active", t.dataset.filter === f));
  load();
}

document.getElementById("tabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tab");
  if (b) setFilter(b.dataset.filter);
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value.trim();
  load();
});

document.getElementById("table").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const { act, id } = b.dataset;
  b.disabled = true;
  try {
    await api(`/api/inquiries/${encodeURIComponent(id)}/action`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: act }),
    });
    const labels = { respond: "Reply logged", followup: "Follow-up sent", quote: "Marked as quoted", won: "Marked as won", lost: "Marked as lost" };
    toast(labels[act] || "Updated");
    await load();
  } catch (err) {
    toast("Something went wrong");
    b.disabled = false;
  }
});

document.getElementById("reset").addEventListener("click", async () => {
  await api("/api/reset", { method: "POST" });
  toast("Demo data reset");
  await load();
});

load();
</script>
</body>
</html>
